name: Build LaTeX Resume and Push to Website Repo

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latex-resume repository
        uses: actions/checkout@v4

      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          repository: KEMDAK/personal-resume-website
          path: website
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}

      # Regenerate sections/*.tex, website resume.ts and index.html meta tags
      # from resume.yaml (single source of truth) before compiling.
      - name: Generate resume sources from resume.yaml
        run: |
          pip install --quiet pyyaml
          python3 scripts/generate.py --website-repo website

      # Compile with a prebuilt TeX Live Docker image (xu-cheng/latex-action)
      # instead of apt-installing ~2GB of texlive-* packages on every run.
      # The apt approach stalled and killed every previous run of this workflow.
      # Single xelatex pass is sufficient: the sources contain no
      # \ref/\label/\cite, table of contents, or bibliography needing a re-run.
      - name: Compile Dark Theme Resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          compiler: xelatex
          args: -interaction=nonstopmode

      - name: Compile Light Theme Resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume-light.tex
          compiler: xelatex
          args: -interaction=nonstopmode

      - name: Rename compiled PDFs
        run: |
          mv resume.pdf resume_dark.pdf
          mv resume-light.pdf resume_light.pdf

      - name: Copy PDFs to website public folder
        run: |
          cp resume_dark.pdf website/client/public/
          cp resume_light.pdf website/client/public/

      - name: Commit and push to website repository
        run: |
          cd website
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add client/public/resume_dark.pdf
          git add client/public/resume_light.pdf
          git add client/src/data/resume.ts
          git add client/index.html
          git diff --staged --quiet || git commit -m "Update resume PDFs and data from latex-resume repo"
          git push
