name: Build LaTeX Resume and Push to Website Repo

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latex-resume repository
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-fonts-extra texlive-latex-extra texlive-science

      - name: Compile Dark Theme Resume
        run: |
          xelatex -interaction=nonstopmode resume.tex
          xelatex -interaction=nonstopmode resume.tex
          mv resume.pdf resume_dark.pdf

      - name: Compile Light Theme Resume
        run: |
          xelatex -interaction=nonstopmode resume-light.tex
          xelatex -interaction=nonstopmode resume-light.tex
          mv resume-light.pdf resume_light.pdf

      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          repository: KEMDAK/personal-resume-website
          path: website
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}

      - name: Copy PDFs to website public folder
        run: |
          cp resume_dark.pdf website/client/public/
          cp resume_light.pdf website/client/public/

      - name: Commit and push to website repository
        run: |
          cd website
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add client/public/resume_dark.pdf
          git add client/public/resume_light.pdf
          git diff --staged --quiet || git commit -m "Update resume PDFs from latex-resume repo"
          git push
