# =============================================================================
# resume.yaml — SINGLE SOURCE OF TRUTH for Kareem Mokhtar's resume content
# =============================================================================
# Edit THIS file to update resume content. Then run:
#
#     python3 scripts/generate.py
#
# to regenerate:
#   - sections/*.tex            (compiled by the CI into resume_dark.pdf /
#                                resume_light.pdf via resume.tex / resume-light.tex)
#   - ../personal-resume-website/client/src/data/resume.ts
#   - ../personal-resume-website/client/src/data/projects.ts
#     (use  python3 scripts/generate.py --website-repo <path>)
#   - meta descriptions in ../personal-resume-website/client/index.html
#
# The CI workflow (.github/workflows/build-and-deploy.yml) runs the generator
# before compiling, so pushing a resume.yaml change to master rebuilds the
# PDFs and pushes the regenerated resume.ts + projects.ts + index.html to the
# website repo.
#
# Conventions:
#   - Plain-text fields are shared by both targets. The .tex generator escapes
#     LaTeX special characters in them automatically.
#   - Fields ending in _tex / the `latex:` block hold LaTeX-only overrides.
#     They are used ONLY because the one-page PDF condenses or rewords content
#     (e.g. Meta's three website entries become one combined PDF entry).
#   - Target flags (both live in the `latex:` block):
#       `latex: {only: true}`    — entry appears in the PDF only (a condensed
#         entry that merges several website entries; the merged entries are
#         then `latex: {exclude: true}`).
#       `latex: {exclude: true}` — entry appears on the website only
#         (the PDF is one page; the entry was previously commented out there).
#   - No flag — entry appears in both targets.
# =============================================================================

